AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  cloud-career-analyzer-backend
  SAM Template for Cloud Career Readiness Analyzer

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt UserPool.Arn

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cloud-career-analyzer-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cloud-career-analyzer-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # 1. S3 Bucket to store CVs securely
  CVUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # 2. Lambda function to generate Presigned URL
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get_upload_url/
      Handler: app.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref CVUploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref CVUploadBucket
      Events:
        GetUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: get

  # 3. Lambda function to extract text from CV (Bypassed Textract)
  ExtractTextFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/extract_text/
      Handler: app.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref CVUploadBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CVUploadBucket
      Events:
        ExtractApi:
          Type: Api
          Properties:
            Path: /extract
            Method: post

  # 4. Lambda function to analyze CV using OpenAI API
  AnalyzeCVFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/analyze_cv/
      Handler: app.handler
      Environment:
        Variables:
          OPENAI_MODEL: gpt-4.1-mini
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            Path: /analyze
            Method: post

  # 5. Private-by-session analysis history (no CV text is stored)
  AnalysisHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AnalysisHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/analysis_history/
      Handler: app.handler
      Environment:
        Variables:
          HISTORY_TABLE: !Ref AnalysisHistoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisHistoryTable
      Events:
        SaveHistory:
          Type: Api
          Properties:
            Path: /analysis-history
            Method: post
        GetHistory:
          Type: Api
          Properties:
            Path: /analysis-history
            Method: get

Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Cognito public app client ID
    Value: !Ref UserPoolClient
  CognitoRegion:
    Description: Region containing Cognito User Pool
    Value: !Ref AWS::Region
  ApiEndpoint:
    Description: "API Gateway endpoint URL to get upload link"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-url"
  BucketName:
    Description: "S3 Bucket Name for CVs"
    Value: !Ref CVUploadBucket
  AnalysisHistoryTableName:
    Description: "DynamoDB table for analysis history"
    Value: !Ref AnalysisHistoryTable
